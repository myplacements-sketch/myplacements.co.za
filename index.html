function expMatch(y, r) {
  if (r === "Any") return true;
  if (r === "0-2 yrs") return y <= 2;
  if (r === "3-5 yrs") return y >= 3 && y <= 5;
  if (r === "6-10 yrs") return y >= 6 && y <= 10;
  if (r === "10+ yrs") return y > 10;
  return true;
}
function isFirstNameOnly(v) { return v.trim().length > 0 && !/\s/.test(v.trim()); }
function isWithinFourMonths(d) {
  if (!d) return false;
  var issued = new Date(d), cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - 4);
  return issued >= cutoff && issued <= new Date();
}
function validEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function validPhone(v) {
  if (!v.trim()) return false;
  var digits = v.replace(/[\s\-\(\)\+]/g,"");
  return /^[0-9]{9,12}$/.test(digits);
}
function validSAPhone(v) {
  if (!v.trim()) return true; // phone optional but if entered must be valid
  var digits = v.replace(/[\s\-\(\)\+]/g,"");
  return /^(0|27)[0-9]{9}$/.test(digits) || /^[0-9]{9,12}$/.test(digits);
}
function nameIsClean(v) {
  // No numbers, no special chars except hyphens (for compound names)
  return /^[A-Za-zÀ-ž\-\s]{2,40}$/.test(v.trim()) && !/\s/.test(v.trim());
}
function aboutIsClean(v) {
  var t = v.trim();
  if (t.length < 30) return {ok:false, msg:"Please write at least 30 characters about yourself."};
  if (t.length > 1000) return {ok:false, msg:"Please keep your description under 1000 characters."};
  if (/\d{9,}/.test(t)) return {ok:false, msg:"Do not include phone numbers in your description."};
  if (/@/.test(t)) return {ok:false, msg:"Do not include your email address in your description."};
  if (/\d{1,3}\s+[A-Za-z]+\s+(Street|St|Road|Rd|Ave|Avenue|Drive|Dr|Close|Cl|Lane|Ln)/i.test(t))
    return {ok:false, msg:"Do not include your home address in your description."};
  return {ok:true, msg:""};
}
function validYearsExp(v) {
  var n = parseInt(v);
  return !isNaN(n) && n >= 0 && n <= 60;
}
function validFileType(file, types) {
  if (!file) return false;
  var name = file.name.toLowerCase();
  return types.some(function(t){ return name.endsWith(t); });
}

function Btn(props) {

    ghost:{background:"transparent", color:C.navy, border:"1.5px solid "+C.gray300},
    danger:{background:C.redLight, color:C.red, border:"1px solid #f5b8bc"},
    purple:{background:C.purple, color:C.white},
  };
  var s = props.size || "md";
  var v = props.variant || "primary";
  return (
    <button onClick={props.onClick} disabled={props.disabled} style={Object.assign({},
      {border:"none", borderRadius:10, fontWeight:700, cursor:"pointer", fontFamily:"inherit",
       transition:"all 0.18s", display:"inline-flex", alignItems:"center", gap:6,
       justifyContent:"center", opacity:props.disabled?0.5:1, width:props.full?"100%":"auto"},
      sz[s], vr[v], props.style||{})}>

    </button>
  );
}

        onDragLeave={function(){setDrag(false);}}
        onDrop={function(e){e.preventDefault();setDrag(false);props.onFile(e.dataTransfer.files[0]);}}

        style={{border:"2px dashed "+(props.error?C.red:drag?C.mint:props.file?C.green:C.gray300),

    </div>
  );
}

function SkillInput(props) {
  var [inp, setInp] = useState("");
  function add() {
    var t = inp.trim();
    if (t && !props.value.includes(t)) props.onChange(props.value.concat([t]));
    setInp("");
  }
  return (
    <div style={{display:"flex", flexDirection:"column", gap:6}}>
      <label style={{fontSize:12, fontWeight:700, color:C.gray700, letterSpacing:"0.04em", textTransform:"uppercase"}}>
        Skills / Duties <span style={{color:C.red}}>*</span>
      </label>
      <div style={{display:"flex", gap:6, flexWrap:"wrap", minHeight:24}}>
        {props.value.map(function(t) {
          return <span key={t} style={{background:C.mintLight, color:C.navy, borderRadius:20,
            padding:"4px 12px", fontSize:12, fontWeight:700, display:"flex", alignItems:"center", gap:5}}>
            {t}
            <button type="button" onClick={function(){props.onChange(props.value.filter(function(x){return x!==t;}));}}
              style={{background:"none", border:"none", cursor:"pointer", color:C.gray500, fontSize:14, padding:0, lineHeight:1}}>×</button>
          </span>;
        })}
      </div>
      <div style={{display:"flex", gap:8}}>
        <input value={inp} onChange={function(e){setInp(e.target.value);}}
          onKeyDown={function(e){if(e.key==="Enter"||e.key===","){e.preventDefault();add();}}}
          placeholder="Type a skill, press Enter..."
          style={Object.assign({}, iCss(false), {flex:1})} />
        <Btn variant="ghost" size="sm" onClick={add}>Add</Btn>
      </div>
      <span style={{fontSize:11, color:C.gray500}}>Press Enter after each skill</span>
    </div>
  );
}

// Payment form component
function PaymentForm(props) {
  // Build the PayFast form and submit it — redirects to PayFast checkout
  var orderId = props.orderId || ("MP-W-" + Date.now());
  var workerName = props.workerName || "Worker";

  function goToPayFast() {
    // Create and auto-submit a hidden form to PayFast
    var form = document.createElement("form");
    form.method = "POST";
    form.action = pfUrl();
    form.style.display = "none";

    var fields = {
      merchant_id:   PAYFAST.merchantId,
      merchant_key:  PAYFAST.merchantKey,
      return_url:    PAYFAST.returnUrl,
      cancel_url:    PAYFAST.cancelUrl,
      notify_url:    PAYFAST.notifyUrl,
      name_first:    workerName,
      email_address: props.email || "",
      m_payment_id:  orderId,
      amount:        "20.00",
      item_name:     "myplacements Profile Subscription",
      item_description: "Monthly listing subscription — profile active for 90 days",
      // Recurring billing
      subscription_type: "1",
      billing_date:  new Date().toISOString().slice(0,10),
      recurring_amount: "20.00",
      frequency:     "3",   // 3 = monthly
      cycles:        "0",   // 0 = indefinite until cancelled
    };

    Object.keys(fields).forEach(function(key) {
      var input = document.createElement("input");
      input.type = "hidden";
      input.name = key;
      input.value = fields[key];
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();
  }

  return (
    <div style={{display:"flex", flexDirection:"column", gap:16}}>
      {/* Plan summary */}
      <div style={{background:"linear-gradient(135deg,"+C.navy+","+C.navyMid+")", borderRadius:14,
        padding:"20px 22px", color:C.white}}>
        <div style={{fontSize:12, opacity:0.7, marginBottom:4, letterSpacing:"0.06em", textTransform:"uppercase"}}>
          myplacements Subscription
        </div>
        <div style={{fontFamily:"'Cormorant Garamond',serif", fontSize:28, fontWeight:700}}>
          R20 <span style={{fontSize:14, opacity:0.7}}>/month</span>
        </div>
        <div style={{fontSize:13, opacity:0.8, marginTop:6}}>
          Profile active for 90 days · Renews monthly · Cancel anytime
        </div>
      </div>

      {/* Order details */}
      <div style={{background:C.gray50, borderRadius:12, padding:"16px"}}>
        <div style={{display:"flex", justifyContent:"space-between", fontSize:13, color:C.gray700, marginBottom:6}}>
          <span>Monthly subscription</span><span style={{fontWeight:700}}>R20.00</span>
        </div>
        <div style={{display:"flex", justifyContent:"space-between", fontSize:13, color:C.gray700, marginBottom:6}}>
          <span>Order reference</span><span style={{fontWeight:700, fontSize:11}}>{orderId}</span>
        </div>
        <div style={{borderTop:"1px solid "+C.gray100, marginTop:10, paddingTop:10,
          display:"flex", justifyContent:"space-between", fontWeight:800, fontSize:15, color:C.navy}}>
          <span>Total today</span><span>R20.00</span>
        </div>
      </div>

      {/* Payment methods */}
      <div style={{display:"flex", gap:8, flexWrap:"wrap", justifyContent:"center"}}>
        {["Visa","Mastercard","EFT","SnapScan","Mobicred"].map(function(m){
          return <span key={m} style={{background:C.white, border:"1px solid "+C.gray100,
            borderRadius:6, padding:"5px 12px", fontSize:11, fontWeight:700, color:C.gray500}}>{m}</span>;
        })}
      </div>

      {PAYFAST.sandbox && (
        <div style={{background:C.amberLight, borderRadius:10, padding:"12px 14px",
          fontSize:12, color:C.amber, fontWeight:600}}>
          🧪 Sandbox mode active — use test card 4000000000000002 on PayFast. No real money charged.
        </div>
      )}

      <Btn variant="navy" full onClick={goToPayFast}>

function BrowsePage(props) {
  var [search, setSearch] = useState("");
  var [cat, setCat] = useState("All");
  var [exp, setExp] = useState("Any");
  var [showExpired, setShowExpired] = useState(false);

  var filtered = props.profiles.filter(function(p) {
    if (!showExpired && p.status === "expired") return false;
    if (p.status === "pending_review" || p.status === "rejected") return false;
    if (cat !== "All" && p.category !== cat) return false;
    if (!expMatch(p.yearsExp, exp)) return false;
    if (search) {
      var q = search.toLowerCase();
      return p.firstName.toLowerCase().includes(q) || p.role.toLowerCase().includes(q) ||
        p.skills.some(function(s){return s.toLowerCase().includes(q);});
    }
    return true;
  });

  return (
    <div style={{maxWidth:1200, margin:"0 auto", padding:"40px 24px"}}>

      <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:4, flexWrap:"wrap", gap:8}}>
        <div>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:34, color:C.navy, margin:0}}>Browse</h2>
          <p style={{color:C.gray500, fontSize:14, marginTop:4}}>{filtered.length} profiles shown</p>
        </div>
        <label style={{display:"flex", alignItems:"center", gap:8, fontSize:13, color:C.gray500, cursor:"pointer"}}>
          <input type="checkbox" checked={showExpired} onChange={function(e){setShowExpired(e.target.checked);}} />
          Show expired profiles
        </label>
      </div>

      <div style={{background:C.white, borderRadius:14, padding:"20px 22px",
        display:"flex", gap:14, flexWrap:"wrap", alignItems:"flex-end",
        boxShadow:"0 2px 12px rgba(0,0,0,0.06)", marginBottom:28, border:"1px solid "+C.gray100}}>
        <div style={{flex:"1 1 180px"}}>
          <label style={{fontSize:11, fontWeight:700, color:C.gray700, letterSpacing:"0.05em",
            textTransform:"uppercase", display:"block", marginBottom:5}}>Search</label>
          <input value={search} onChange={function(e){setSearch(e.target.value);}}
            placeholder="Name, role or skill..."
            style={Object.assign({}, iCss(false), {width:"100%"})} />
        </div>
        <div>
          <label style={{fontSize:11, fontWeight:700, color:C.gray700, letterSpacing:"0.05em",
            textTransform:"uppercase", display:"block", marginBottom:5}}>Category</label>
          <select value={cat} onChange={function(e){setCat(e.target.value);}}
            style={Object.assign({}, iCss(false), {minWidth:160})}>
            {CATEGORIES.map(function(c){return <option key={c}>{c}</option>;})}
          </select>
        </div>
        <div>
          <label style={{fontSize:11, fontWeight:700, color:C.gray700, letterSpacing:"0.05em",
            textTransform:"uppercase", display:"block", marginBottom:5}}>Experience</label>
          <select value={exp} onChange={function(e){setExp(e.target.value);}}
            style={Object.assign({}, iCss(false), {minWidth:130})}>
            {EXP_RANGES.map(function(r){return <option key={r}>{r}</option>;})}
          </select>
        </div>
        <Btn variant="ghost" size="sm" onClick={function(){setSearch("");setCat("All");setExp("Any");}}>Clear</Btn>
      </div>

      {filtered.length === 0
        ? <div style={{textAlign:"center", padding:"80px 0", color:C.gray300, fontSize:18}}>No profiles match your filters.</div>
        : <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))", gap:22}}>
            {filtered.map(function(p) {
              return <ProfileCard key={p.id} cv={p}
                inCart={props.cart.some(function(c){return c.id===p.id;})}
                onAdd={props.onAdd} onRemove={props.onRemove} onView={props.onView} />;
            })}
          </div>
      }
    </div>
  );
}

function EmployeePage(props) {
  var [step, setStep] = useState(0);
  var [firstName, setFirstName] = useState("");
  var [about, setAbout] = useState("");
  var [category, setCategory] = useState("Au Pair");
  var [yearsExp, setYearsExp] = useState("");
  var [education, setEducation] = useState("");
  var [availability, setAvailability] = useState("Immediately");
  var [skills, setSkills] = useState([]);
  var [email, setEmail] = useState("");
  var [phone, setPhone] = useState("");
  var [cvFile, setCvFile] = useState(null);
  var [criminalFile, setCriminalFile] = useState(null);
  var [photoFile, setPhotoFile] = useState(null);
  var [photoDataUrl, setPhotoDataUrl] = useState(null);
  var [criminalDate, setCriminalDate] = useState("");
  var [errors, setErrors] = useState({});
  var [newProfile, setNewProfile] = useState(null);
  var [paymentDone, setPaymentDone] = useState(false);
  var [agreeNoGuarantee, setAgreeNoGuarantee] = useState(false);
  var [agreePopia, setAgreePopia] = useState(false);

  function handlePhotoFile(f) {
    if (!f) return;
    setPhotoFile(f);
    var r = new FileReader();
    r.onload = function(e) { setPhotoDataUrl(e.target.result); };
    r.readAsDataURL(f);
  }

  function validate(s) {
    var e = {};

    if (s===0) {
      // First name checks
      if (!firstName.trim()) {
        e.firstName = "First name is required.";
      } else if (/\s/.test(firstName.trim())) {
        e.firstName = "First name only — no surname or spaces.";
      } else if (!/^[A-Za-zÀ-ž\-]{2,40}$/.test(firstName.trim())) {
        e.firstName = "First name must contain letters only — no numbers or symbols.";
      } else if (firstName.trim().length < 2) {
        e.firstName = "First name must be at least 2 characters.";
      }
      // About checks
      var aboutCheck = aboutIsClean(about);
      if (!about.trim()) {
        e.about = "Please write something about yourself.";
      } else if (!aboutCheck.ok) {
        e.about = aboutCheck.msg;
      }
      // Waiver checks
      if (!agreeNoGuarantee) {
        e.agreeNoGuarantee = "You must acknowledge that myplacements is a placement assistance platform and does not guarantee employment.";
      }
      if (!agreePopia) {
        e.agreePopia = "You must accept the POPIA consent before your personal information can be stored on our platform.";
      }
    }

    if (s===1) {
      // Years experience
      if (!yearsExp.toString().trim()) {
        e.yearsExp = "Please enter your years of experience.";
      } else if (!validYearsExp(yearsExp)) {
        e.yearsExp = "Please enter a realistic number between 0 and 60.";
      }
      // Skills
      if (!skills.length) {
        e.skills = "Please add at least one skill or duty.";
      } else if (skills.length < 2) {
        e.skills = "Please add at least 2 skills so employers know what you offer.";
      }
      // Email
      if (!email.trim()) {
        e.email = "Email address is required.";
      } else if (!validEmail(email)) {
        e.email = "Please enter a valid email address (e.g. name@gmail.com).";
      }
      // Phone
      if (!phone.trim()) {
        e.phone = "Phone number is required so employers can contact you.";
      } else if (!validSAPhone(phone)) {
        e.phone = "Please enter a valid South African phone number (e.g. 082 123 4567).";
      }
      // Education
      if (!education.trim()) {
        e.education = "Please enter your highest qualification (e.g. Grade 12, Certificate).";
      } else if (education.trim().length < 3) {
        e.education = "Please describe your qualification in more detail.";
      }
    }

    if (s===2) {
      // CV file
      if (!cvFile) {
        e.cv = "Please upload your CV or profile document.";
      } else if (!validFileType(cvFile, [".pdf",".doc",".docx"])) {
        e.cv = "CV must be a PDF or Word document (.pdf, .doc, .docx).";
      }
      // Criminal clearance file
      if (!criminalFile) {
        e.criminal = "Police clearance certificate is required.";
      } else if (!validFileType(criminalFile, [".pdf",".jpg",".jpeg",".png"])) {
        e.criminal = "Clearance must be a PDF or image file (.pdf, .jpg, .png).";
      }
      // Clearance date
      if (!criminalDate) {
        e.criminalDate = "Please enter the date printed on your police clearance.";
      } else {
        var issued = new Date(criminalDate);
        var today = new Date();
        if (issued > today) {
          e.criminalDate = "Issue date cannot be in the future.";
        } else if (!isWithinFourMonths(criminalDate)) {
          e.criminalDate = "Certificate is older than 4 months — please obtain a new one from SAPS.";
        }
      }
    }

    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function next() { if (validate(step)) setStep(step+1); }
  function back() { setStep(step-1); }

  function buildProfile() {
    return {
      id: "p"+Date.now(),
      consentNoGuarantee: agreeNoGuarantee, consentPopia: agreePopia,
      consentDate: new Date().toISOString(),
      firstName: firstName.trim(), role: category, category: category,
      yearsExp: parseInt(yearsExp)||1, skills: skills, education: education,
      availability: availability, about: about, price: 99, email: email, phone: phone,
      hasCv: !!cvFile, hasCriminalRecord: !!criminalFile,
      photoDataUrl: photoDataUrl, photoColor: CAT_GRADIENTS[category]||["#e0e7ff","#3730a3"],
      status: "pending", uploadDate: new Date(),
      expiryDate: addDays(new Date(), 90), nextBillingDate: addDays(new Date(), 30), monthlyFee: 20,
    };
  }

  function submitDocs() {
    if (!validate(2)) return;
    setNewProfile(buildProfile());
    setStep(3); // go to payment step
  }

  function handlePaymentSuccess() {
    var p = Object.assign({}, newProfile, {status:"active"});
    props.onSubmit(p);
    setPaymentDone(true);
  }

  // Success screen
  if (paymentDone && newProfile) {
    return (
      <div style={{maxWidth:580, margin:"60px auto", padding:"0 24px"}}>
        <div style={{background:C.white, borderRadius:22, padding:"40px 36px",
          border:"1px solid "+C.gray100, boxShadow:"0 4px 24px rgba(0,0,0,0.08)", textAlign:"center"}}>
          <div style={{fontSize:64, marginBottom:16}}>🎉</div>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:32, color:C.navy, marginBottom:8}}>
            You are live, {newProfile.firstName}!
          </h2>
          <p style={{color:C.gray500, lineHeight:1.75, marginBottom:28, fontSize:14}}>
            Your profile is now active and visible to employers. Your subscription of R20/month has been activated.
          </p>

          {/* Timeline */}
          <div style={{background:C.gray50, borderRadius:14, padding:"20px", marginBottom:28, textAlign:"left"}}>
            <div style={{fontWeight:700, color:C.navy, fontSize:13, marginBottom:14}}>📅 Your profile timeline</div>
            {[
              {day:"Today", label:"Profile goes live", color:C.green, icon:"✅"},
              {day:formatDate(addDays(new Date(),30)), label:"30-day check-in email sent to you", color:C.blue, icon:"📬"},
              {day:formatDate(addDays(new Date(),60)), label:"60-day renewal reminder email", color:C.amber, icon:"⚠️"},
              {day:formatDate(addDays(new Date(),90)), label:"Profile auto-removed if not renewed", color:C.red, icon:"🗑️"},
            ].map(function(item) {
              return (
                <div key={item.day} style={{display:"flex", gap:14, alignItems:"flex-start", marginBottom:12}}>
                  <div style={{fontSize:18, flexShrink:0}}>{item.icon}</div>
                  <div>
                    <div style={{fontSize:12, fontWeight:700, color:item.color}}>{item.day}</div>
                    <div style={{fontSize:13, color:C.gray700}}>{item.label}</div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Email preview */}
          <div style={{textAlign:"left", marginBottom:28}}>
            <div style={{fontWeight:700, color:C.navy, fontSize:13, marginBottom:12}}>📧 Automated emails you will receive</div>
            <EmailPreviewCard type="month1" profile={newProfile} />
          </div>

          <Btn variant="navy" full onClick={function(){setPaymentDone(false);setStep(0);
            setFirstName("");setAbout("");setCategory("Au Pair");setYearsExp("");setEducation("");
            setAvailability("Immediately");setSkills([]);setEmail("");setPhone("");
            setCvFile(null);setCriminalFile(null);setPhotoFile(null);setPhotoDataUrl(null);setCriminalDate("");
            setAgreeNoGuarantee(false);setAgreePopia(false);}}>
            Register Another Profile
          </Btn>
        </div>
      </div>
    );
  }

  var colors = CAT_GRADIENTS[category]||["#e0e7ff","#3730a3"];

  return (
    <div style={{maxWidth:620, margin:"0 auto", padding:"48px 24px"}}>
      <h2 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:32, color:C.navy, marginBottom:4}}>
        Register Your Profile
      </h2>
      <p style={{color:C.gray500, fontSize:14, marginBottom:32, lineHeight:1.7}}>
        Get listed for R20/month. Only your first name and professional details are shown publicly.
      </p>
      <Steps steps={["Profile","Details","Documents","Payment"]} current={step} />

      <div style={{background:C.white, borderRadius:18, padding:"32px",
        border:"1px solid "+C.gray100, boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>

        {step === 0 && (
          <div style={{display:"flex", flexDirection:"column", gap:20}}>
            {Object.keys(errors).length > 0 && (
              <div style={{background:C.redLight, border:"1px solid #f5b8bc", borderRadius:10,
                padding:"12px 16px", fontSize:12, color:C.red, fontWeight:600}}>
                ⚠ Please fix the highlighted fields before continuing.
              </div>
            )}
            <div style={{background:C.greenLight, borderRadius:10, padding:"12px 16px", fontSize:13, color:C.green, fontWeight:600}}>
              This information is shown publicly to employers
            </div>
            <div style={{display:"flex", justifyContent:"center"}}>
              <PhotoUpload file={photoFile} onFile={handlePhotoFile} previewUrl={photoDataUrl} colors={colors} />
            </div>
            <FInput label="First Name" required value={firstName}
              onChange={function(e){setFirstName(e.target.value);}}
              placeholder="e.g. Amara" hint="First name only — no surname." error={errors.firstName} />
            {firstName && (isFirstNameOnly(firstName)
              ? <div style={{background:C.greenLight, borderRadius:8, padding:"9px 14px", fontSize:12, color:C.green, fontWeight:700, marginTop:-12}}>First name only — looks good.</div>
              : <div style={{background:C.redLight, borderRadius:8, padding:"9px 14px", fontSize:12, color:C.red, fontWeight:700, marginTop:-12}}>Space detected — first name only, no surname.</div>
            )}
            <FSelect label="Category" required value={category} onChange={function(e){setCategory(e.target.value);}}>
              {CATEGORIES.filter(function(c){return c!=="All";}).map(function(c){return <option key={c}>{c}</option>;})}
            </FSelect>
            <FTextarea label="About Yourself" required rows={5} value={about}
              onChange={function(e){setAbout(e.target.value);}}
              placeholder="Describe your experience and personality. Do not include your surname, address, or employer names."

            <div style={{display:"flex", justifyContent:"space-between", marginTop:-14}}>

            <div style={{background:C.redLight, borderRadius:10, padding:"12px 16px", fontSize:12, color:C.red, fontWeight:600}}>

            </div>

            {/* ── WAIVERS ── */}
            <div style={{borderTop:"2px solid "+C.gray100, paddingTop:22, display:"flex", flexDirection:"column", gap:14}}>
              <div style={{fontSize:12, fontWeight:800, color:C.navy, textTransform:"uppercase",
                letterSpacing:"0.08em"}}>Legal Agreements — Required</div>

              {/* Waiver 1 — No guarantee of employment */}
              <div style={{background:errors.agreeNoGuarantee?C.redLight:agreeNoGuarantee?C.greenLight:C.gray50,
                border:"1.5px solid "+(errors.agreeNoGuarantee?C.red:agreeNoGuarantee?C.green:C.gray100),
                borderRadius:12, padding:"16px 18px", transition:"all 0.2s"}}>
                <label style={{display:"flex", gap:14, alignItems:"flex-start", cursor:"pointer"}}>

                    </div>
                    <div style={{fontSize:12, color:C.gray700, lineHeight:1.75}}>
                      I understand and agree that <strong>myplacements is a placement assistance platform only</strong> and does not guarantee that I will be hired or placed in employment. myplacements connects workers with potential employers but does not make employment decisions, does not enter into any employment contract on my behalf, and accepts no liability for any outcome of the placement process. Success depends on individual employers reviewing my profile and making their own hiring decisions.

                    </div>
                    <div style={{fontSize:12, color:C.gray700, lineHeight:1.75}}>
                      In accordance with the <strong>Protection of Personal Information Act (POPIA), Act 4 of 2013</strong>, I hereby give my informed consent for myplacements to collect, store and process my personal information — including my name, contact details, qualifications, employment history and police clearance certificate — for the purpose of facilitating domestic placement services in South Africa. I understand that: (1) my information will be stored securely in a database; (2) my contact details will only be shared with verified employers who have paid to unlock my profile; (3) I may request the removal of my information at any time by contacting myplacements; (4) my profile will be automatically removed after 90 days if not renewed; and (5) myplacements will not sell my personal information to third parties.
                    </div>
                  </div>
                </label>
                {errors.agreePopia && (
                  <div style={{fontSize:11, color:C.red, fontWeight:600, marginTop:8, paddingLeft:34}}>
                    ⚠ {errors.agreePopia}
                  </div>
                )}
              </div>

              {/* Confirmation stamp once both are ticked */}
              {agreeNoGuarantee && agreePopia && (
                <div style={{background:C.greenLight, border:"1px solid "+C.green, borderRadius:10,
                  padding:"12px 16px", fontSize:12, color:C.green, fontWeight:700,
                  display:"flex", alignItems:"center", gap:8}}>
                  ✅ Agreements confirmed — you may continue to the next step.
                </div>
              )}
            </div>

          </div>
        )}

        {step === 1 && (
          <div style={{display:"flex", flexDirection:"column", gap:20}}>
            {Object.keys(errors).length > 0 && (
              <div style={{background:C.redLight, border:"1px solid #f5b8bc", borderRadius:10,
                padding:"12px 16px", fontSize:12, color:C.red, fontWeight:600}}>
                ⚠ Please fix the highlighted fields before continuing.
              </div>
            )}
            <div className="form-grid-2" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16}}>
              <FInput label="Years Experience" required type="number" min="0" max="60" value={yearsExp}
                onChange={function(e){setYearsExp(e.target.value);}}
                placeholder="e.g. 3" error={errors.yearsExp} />
              <FSelect label="Availability" value={availability} onChange={function(e){setAvailability(e.target.value);}}>
                {AVAILABILITIES.map(function(a){return <option key={a}>{a}</option>;})}
              </FSelect>
            </div>
            <FInput label="Qualifications / Education" required value={education}
              onChange={function(e){setEducation(e.target.value);}}
              placeholder="e.g. Grade 12, Early Childhood Development Certificate"
              error={errors.education}
              hint="Enter your highest qualification" />
            <SkillInput value={skills} onChange={setSkills} />
            {errors.skills && <span style={{fontSize:12, color:C.red}}>{errors.skills}</span>}
            <div style={{borderTop:"1px solid "+C.gray100, paddingTop:20}}>
              <div style={{background:C.amberLight, borderRadius:10, padding:"12px 16px", fontSize:12, color:C.amber, fontWeight:600, marginBottom:16}}>
                🔒 Contact details — only revealed to employers after purchase
              </div>
              <div className="form-grid-2" style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16}}>
                <FInput label="Email Address" required type="email" value={email}
                  onChange={function(e){setEmail(e.target.value);}} placeholder="you@email.com" error={errors.email} />
                <FInput label="Phone Number" required value={phone}
                  onChange={function(e){setPhone(e.target.value);}}
                  placeholder="082 123 4567" error={errors.phone}
                  hint="SA number e.g. 082 123 4567" />
              </div>
            </div>
          </div>
        )}

        {step === 2 && (
          <div style={{display:"flex", flexDirection:"column", gap:22}}>
            {Object.keys(errors).length > 0 && (
              <div style={{background:C.redLight, border:"1px solid #f5b8bc", borderRadius:10,
                padding:"12px 16px", fontSize:12, color:C.red, fontWeight:600}}>
                ⚠ Please fix the highlighted fields before continuing.
              </div>
            )}
            <div style={{background:C.gray50, borderRadius:10, padding:"14px 16px", fontSize:13, color:C.gray700, lineHeight:1.65}}>
              Upload your profile document and a police clearance certificate issued within the last 4 months.
            </div>
            <FileDropZone label="Profile Document / CV" icon="📄"
              hint="PDF, Word or similar" accept=".pdf,.doc,.docx"
              file={cvFile} onFile={setCvFile} error={errors.cv} />
            <FileDropZone label="Police Clearance Certificate" icon="🔒"
              hint="Must be dated within the last 4 months" accept=".pdf,.jpg,.jpeg,.png"
              file={criminalFile} onFile={setCriminalFile} error={errors.criminal} />
            <FInput label="Clearance Issue Date" required type="date" value={criminalDate}
              onChange={function(e){setCriminalDate(e.target.value);}}
              hint="The date printed on your police clearance" error={errors.criminalDate} style={{maxWidth:260}} />
            {criminalDate && isWithinFourMonths(criminalDate) && (
              <div style={{background:C.greenLight, borderRadius:10, padding:"11px 16px", fontSize:13, color:C.green, fontWeight:600}}>
                ✅ Date confirmed — within the 4-month window.
              </div>
            )}
            {criminalDate && !isWithinFourMonths(criminalDate) && (
              <div style={{background:C.redLight, borderRadius:10, padding:"11px 16px", fontSize:13, color:C.red, fontWeight:700}}>
                This certificate is older than 4 months. Please obtain a new one.
              </div>
            )}
          </div>
        )}

        {step === 3 && (
          <div style={{display:"flex", flexDirection:"column", gap:0}}>
            <h3 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:22, color:C.navy, marginBottom:6}}>
              Activate your profile
            </h3>
            <p style={{fontSize:13, color:C.gray500, marginBottom:20, lineHeight:1.7}}>
              Your profile is ready! Pay R20/month to go live. Your listing will be active for 90 days. We will email you reminders before it expires.
            </p>
            <PaymentForm onSuccess={handlePaymentSuccess}
              email={email} workerName={firstName}
              orderId={"MP-W-"+Date.now()} />
          </div>
        )}

        {step < 3 && (
          <div style={{display:"flex", justifyContent:"space-between", marginTop:28}}>
            {step > 0 ? <Btn variant="ghost" onClick={back}>Back</Btn> : <div />}
            {step < 2
              ? <Btn variant="primary" onClick={next}>Continue</Btn>
              : <Btn variant="navy" onClick={submitDocs}>Continue to Payment</Btn>
            }
          </div>
        )}
      </div>
    </div>
  );
}

function EmployerPage(props) {
  var [tab, setTab] = useState("signup");
  var [companyName, setCompanyName] = useState("");
  var [contactPerson, setContactPerson] = useState("");
  var [erEmail, setErEmail] = useState("");
  var [phone, setPhone] = useState("");
  var [industry, setIndustry] = useState("");
  var [password, setPassword] = useState("");
  var [errors, setErrors] = useState({});

  function validateSignup() {
    var e = {};
    if (!companyName.trim()) e.companyName = "Required.";
    if (!contactPerson.trim()) e.contactPerson = "Required.";
    if (!validEmail(erEmail)) e.email = "Valid email required.";
    if (!phone.trim()) e.phone = "Required.";
    if (!password||password.length<6) e.password = "Min 6 characters.";
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function submitSignup() {
    if (!validateSignup()) return;
    if (props.accounts.find(function(a){return a.email===erEmail;})) {
      setErrors(function(e){return Object.assign({},e,{email:"Account already exists."});});
      return;
    }
    props.onRegister({id:"er"+Date.now(), companyName:companyName, contactPerson:contactPerson,
      email:erEmail, phone:phone, industry:industry, password:password});
  }

  function submitLogin() {
    var found = props.accounts.find(function(a){return a.email===erEmail&&a.password===password;});
    if (!found) { setErrors({login:"Incorrect email or password."}); return; }
    props.onLogin(found);
  }

  if (props.currentEmployer) {
    return (
      <div style={{maxWidth:520, margin:"80px auto", textAlign:"center", padding:"0 24px"}}>
        <div style={{fontSize:64}}>🏢</div>
        <h2 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:32, color:C.navy, marginBottom:12}}>
          Welcome back, {props.currentEmployer.contactPerson.split(" ")[0]}!
        </h2>
        <p style={{color:C.gray500, lineHeight:1.75, marginBottom:28}}>
          Logged in as <strong>{props.currentEmployer.companyName}</strong>. Browse profiles and unlock contact details for R99 each.
        </p>
        <Btn variant="primary" size="lg" onClick={function(){props.setPage("browse");}}>Browse Profiles</Btn>
        <div style={{marginTop:16}}>
          <button onClick={props.onLogout} style={{background:"none", border:"none", color:C.gray500,
            fontSize:13, cursor:"pointer", textDecoration:"underline", fontFamily:"inherit"}}>Log out</button>
        </div>
      </div>
    );
  }

  return (
    <div style={{maxWidth:520, margin:"0 auto", padding:"48px 24px"}}>
      <div style={{display:"flex", background:C.gray100, borderRadius:12, padding:4, marginBottom:32}}>
        {[["signup","Create Account"],["login","Log In"]].map(function(item) {
          return <button key={item[0]} onClick={function(){setTab(item[0]);setErrors({});}}
            style={{flex:1, padding:"10px", borderRadius:9, fontSize:13, fontWeight:700,
              border:"none", cursor:"pointer", fontFamily:"inherit",
              background:tab===item[0]?C.navy:"transparent", color:tab===item[0]?C.white:C.gray500}}>{item[1]}</button>;
        })}
      </div>
      <div style={{background:C.white, borderRadius:18, padding:"32px", border:"1px solid "+C.gray100, boxShadow:"0 4px 20px rgba(0,0,0,0.06)"}}>
        {tab === "signup" ? (
          <div style={{display:"flex", flexDirection:"column", gap:18}}>
            <div>
              <h2 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:26, color:C.navy, margin:0}}>Employer Account</h2>
              <p style={{fontSize:13, color:C.gray500, marginTop:4}}>Free account. Pay R99 per profile you unlock.</p>
            </div>
            <FInput label="Company / Family Name" required value={companyName}
              onChange={function(e){setCompanyName(e.target.value);}} placeholder="e.g. Smith Family" error={errors.companyName} />
            <FInput label="Contact Person" required value={contactPerson}
              onChange={function(e){setContactPerson(e.target.value);}} placeholder="Your full name" error={errors.contactPerson} />
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:16}}>
              <FInput label="Email" required type="email" value={erEmail}
                onChange={function(e){setErEmail(e.target.value);}} placeholder="you@email.com" error={errors.email} />
              <FInput label="Phone" required value={phone}
                onChange={function(e){setPhone(e.target.value);}} placeholder="+27 11 234 5678" error={errors.phone} />
            </div>
            <FInput label="Industry / Description" value={industry}
              onChange={function(e){setIndustry(e.target.value);}} placeholder="e.g. Private household" />
            <FInput label="Password" required type="password" value={password}
              onChange={function(e){setPassword(e.target.value);}} placeholder="Min 6 characters" error={errors.password} />
            <Btn variant="navy" full onClick={submitSignup} style={{marginTop:6}}>Create Account</Btn>
          </div>
        ) : (
          <div style={{display:"flex", flexDirection:"column", gap:18}}>
            <h2 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:26, color:C.navy, margin:0}}>Log In</h2>
            {errors.login && <div style={{background:C.redLight, borderRadius:9, padding:"11px 14px",
              fontSize:13, color:C.red, fontWeight:600}}>{errors.login}</div>}
            <FInput label="Email" required type="email" value={erEmail}
              onChange={function(e){setErEmail(e.target.value);}} placeholder="you@email.com" />
            <FInput label="Password" required type="password" value={password}
              onChange={function(e){setPassword(e.target.value);}} placeholder="Your password" />
            <Btn variant="navy" full onClick={submitLogin} style={{marginTop:6}}>Log In</Btn>
            <p style={{fontSize:12, color:C.gray500, textAlign:"center", margin:0}}>
              No account?{" "}
              <button onClick={function(){setTab("signup");}} style={{background:"none", border:"none",
                color:C.blue, cursor:"pointer", fontWeight:700, fontSize:12, fontFamily:"inherit"}}>
                Create one free
              </button>
            </p>
          </div>
        )}
      </div>
    </div>
  );
}

  return (

      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))", gap:16, marginBottom:36}}>

            <div style={{fontSize:12, color:item.color, fontWeight:700}}>{item.label}</div>

        })}

      {/* Profile list with email previews */}
      {props.profiles.map(function(p) {

          : p.status==="expiring" ? "expiring"
          : days <= 60 ? "month2" : "month1";
        return (
          <div key={p.id} style={{background:C.white, borderRadius:16, padding:"22px 24px",
            marginBottom:20, border:"1px solid "+C.gray100, boxShadow:"0 2px 8px rgba(0,0,0,0.04)"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center",
              marginBottom:16, flexWrap:"wrap", gap:8}}>
              <div style={{display:"flex", alignItems:"center", gap:12}}>
                <div style={{width:44, height:44, borderRadius:"50%",
                  background:"linear-gradient(135deg,"+(p.photoColor||["#e0e7ff","#3730a3"])[0]+","+(p.photoColor||["#e0e7ff","#3730a3"])[1]+")",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  color:C.white, fontSize:18, fontWeight:700, fontFamily:"'Cormorant Garamond',serif", flexShrink:0}}>
                  {p.firstName[0]}
                </div>
                <div>
                  <div style={{fontWeight:700, color:C.navy}}>{p.firstName} · {p.role}</div>
                  <div style={{fontSize:12, color:C.gray500}}>
                    Uploaded: {formatDate(p.uploadDate)} · Expires: {formatDate(p.expiryDate)}
                  </div>
                </div>
              </div>
              <StatusPill status={p.status} days={days} />
            </div>
            <EmailPreviewCard type={emailType} profile={p} />
          </div>
        );
      })}
    </div>
  );
}


// ── Admin Panel ───────────────────────────────────────────────────────────────
var ADMIN_PASSWORD = "Cardney@1";

function AdminPage(props) {
  var [authed, setAuthed] = useState(false);
  var [pw, setPw] = useState("");
  var [pwError, setPwError] = useState("");
  var [selectedId, setSelectedId] = useState(null);
  var [rejectModal, setRejectModal] = useState(null);
  var [rejectReason, setRejectReason] = useState("");
  var [tab, setTab] = useState("pending");
  var [docViewer, setDocViewer] = useState(null);

  var pending  = props.profiles.filter(function(p){return p.status==="pending_review";});
  var approved = props.profiles.filter(function(p){return p.status==="active"||p.status==="expiring";});
  var rejected = props.profiles.filter(function(p){return p.status==="rejected";});
  var expired  = props.profiles.filter(function(p){return p.status==="expired";});

  function login() {
    if (pw === ADMIN_PASSWORD) { setAuthed(true); setPwError(""); }
    else setPwError("Incorrect password.");
  }
  function approve(p) {
    props.onUpdate(p.id,{status:"active",verified:true,verifiedDate:new Date()});
    setSelectedId(null);
  }
  function doReject(p,reason) {
    props.onUpdate(p.id,{status:"rejected",verified:false,rejectionReason:reason||"Documents could not be verified."});
    setRejectModal(null); setRejectReason(""); setSelectedId(null);
  }
  function del(id) { props.onDelete(id); setSelectedId(null); }

  if (!authed) {
    return (
      <div style={{minHeight:"calc(100vh - 64px)", background:"linear-gradient(150deg,#0a1628,#0F2137,#0a1628)",
        display:"flex", alignItems:"center", justifyContent:"center", padding:24}}>
        <div style={{background:"rgba(255,255,255,0.05)", backdropFilter:"blur(10px)",
          borderRadius:24, padding:"48px 40px", width:"100%", maxWidth:400,
          border:"1px solid rgba(255,255,255,0.1)", textAlign:"center",
          boxShadow:"0 32px 80px rgba(0,0,0,0.5)"}}>
          <div style={{fontSize:52, marginBottom:12}}>🔐</div>
          <div style={{background:"rgba(62,207,178,0.15)", border:"1px solid rgba(62,207,178,0.3)",
            borderRadius:20, padding:"5px 16px", fontSize:10, fontWeight:800, letterSpacing:"0.15em",
            color:C.mint, display:"inline-block", marginBottom:20, textTransform:"uppercase"}}>
            Admin Portal
          </div>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:30, color:C.white, marginBottom:8}}>
            myplacements Admin
          </h2>
          <p style={{color:"rgba(255,255,255,0.5)", fontSize:13, marginBottom:32, lineHeight:1.6}}>
            Authorised personnel only. Enter your admin password to continue.
          </p>
          <div style={{display:"flex", flexDirection:"column", gap:14, textAlign:"left"}}>
            <div style={{display:"flex", flexDirection:"column", gap:5}}>
              <label style={{fontSize:11, fontWeight:700, color:"rgba(255,255,255,0.6)",
                letterSpacing:"0.06em", textTransform:"uppercase"}}>Admin Password</label>
              <input type="password" value={pw}
                onChange={function(e){setPw(e.target.value);}}
                onKeyDown={function(e){if(e.key==="Enter")login();}}
                placeholder="Enter password"
                style={{padding:"12px 14px", borderRadius:9,
                  border:"1.5px solid "+(pwError?"#E63946":"rgba(255,255,255,0.15)"),
                  fontSize:14, fontFamily:"inherit", background:"rgba(255,255,255,0.08)",
                  color:C.white, outline:"none", width:"100%", boxSizing:"border-box"}}/>
              {pwError && <span style={{fontSize:12, color:"#E63946", fontWeight:600}}>{pwError}</span>}
            </div>
            <button onClick={login} style={{padding:"13px", background:C.mint, color:C.navy,
              border:"none", borderRadius:10, fontSize:14, fontWeight:800,
              cursor:"pointer", fontFamily:"inherit", marginTop:4}}>
              Enter Admin Panel →
            </button>
            <p style={{fontSize:11, color:"rgba(255,255,255,0.3)", textAlign:"center", margin:0}}>
              myplacements admin access only
            </p>
          </div>
        </div>
      </div>
    );
  }

  var tabList = tab==="pending"?pending:tab==="approved"?approved:tab==="rejected"?rejected:expired;

  return (
    <div style={{maxWidth:1100,margin:"0 auto",padding:"40px 24px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28,flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontFamily:"'Cormorant Garamond',serif",fontSize:34,color:C.navy,margin:0}}>Admin Panel</h2>
          <p style={{color:C.gray500,fontSize:14,marginTop:4}}>Review documents and verify worker profiles before they go live</p>
        </div>
        <button onClick={function(){setAuthed(false);setPw("");}}
          style={{background:"none",border:"1px solid "+C.gray300,borderRadius:8,
            padding:"8px 16px",fontSize:13,color:C.gray500,cursor:"pointer",fontFamily:"inherit"}}>
          Log out of admin
        </button>
      </div>

      {/* Stats tabs */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:24}}>
        {[
          {label:"Pending Review",n:pending.length,color:C.amber,bg:C.amberLight,key:"pending"},
          {label:"Approved & Live",n:approved.length,color:C.green,bg:C.greenLight,key:"approved"},
          {label:"Rejected",n:rejected.length,color:C.red,bg:C.redLight,key:"rejected"},
          {label:"Expired",n:expired.length,color:C.gray500,bg:C.gray100,key:"expired"},

              <div style={{fontFamily:"'Cormorant Garamond',serif",fontSize:34,fontWeight:700,color:item.color}}>{item.n}</div>
              <div style={{fontSize:12,color:item.color,fontWeight:700}}>{item.label}</div>
            </button>
          );
        })}
      </div>

      {tab==="pending" && pending.length>0 && (
        <div style={{background:C.amberLight,border:"1px solid "+C.amber,borderRadius:12,
          padding:"14px 20px",marginBottom:20,fontSize:13,color:C.amber,fontWeight:600}}>
          ⚠️ {pending.length} profile{pending.length!==1?"s":""} waiting for document verification — profiles are hidden from employers until approved.
        </div>

      {tab==="pending" && pending.length===0 && (

        {tabList.map(function(p){

          var isRejected = p.status==="rejected";

// ── MP Logo — accurate recreation of uploaded brand file ─────────────────────
function MPLogo(props) {
  var size = props.size || 36;
  // Scale height proportionally — logo is roughly square
  return (
    <svg width={size} height={size} viewBox="0 0 120 115" fill="none"
      xmlns="http://www.w3.org/2000/svg"
      style={Object.assign({flexShrink:0, display:"block"}, props.style||{})}>
      <defs>
        {/* Deep teal-green — M left stem and dark faces */}
        <linearGradient id="mpDark" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
          <stop offset="0%" stopColor="#2a9055"/>
          <stop offset="100%" stopColor="#155c33"/>
        </linearGradient>
        {/* Mid green — M left diagonal face */}
        <linearGradient id="mpMid" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
          <stop offset="0%" stopColor="#28a04e"/>
          <stop offset="100%" stopColor="#176635"/>
        </linearGradient>
        {/* Lime yellow-green — M right peak + P bowl overlay */}
        <linearGradient id="mpLime" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
          <stop offset="0%" stopColor="#a8d932"/>
          <stop offset="100%" stopColor="#72a820"/>
        </linearGradient>
        {/* Light lime — lower P stem and inner glow */}
        <linearGradient id="mpLight" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
          <stop offset="0%" stopColor="#c5e85a"/>
          <stop offset="100%" stopColor="#88c030"/>
        </linearGradient>
        {/* P bowl base */}
        <linearGradient id="mpPbowl" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
          <stop offset="0%" stopColor="#28a04e"/>
          <stop offset="100%" stopColor="#3aaa5c"/>
        </linearGradient>
      </defs>

      {/* ── M LEFT VERTICAL STEM (dark teal, far left) ── */}
      <rect x="8" y="8" width="17" height="72" rx="3" fill="url(#mpDark)"/>

      {/* ── M LEFT DIAGONAL FACE (mid green, slopes to centre valley) ── */}
      <path d="M8 8 L25 8 L56 55 L39 55 Z" fill="url(#mpMid)"/>

      {/* ── M RIGHT DIAGONAL — lime, creates the pointed V valley ── */}
      <path d="M56 8 L73 8 L56 55 L39 55 Z" fill="url(#mpLime)"/>

      {/* ── M RIGHT PEAK — small upward tab, lime ── */}
      <path d="M56 8 L73 8 L73 28 L56 28 Z" fill="url(#mpLime)"/>

      {/* ── P VERTICAL STEM — shares x position with M right peak ── */}
      <rect x="56" y="8" width="17" height="80" rx="3" fill="url(#mpDark)"/>

      {/* ── P BOWL BODY — the C-shaped outer shell ── */}
      <path d="
        M56 8
        L80 8
        Q112 8 112 38
        Q112 68 80 68
        L56 68
        L56 52
        L78 52
        Q94 52 94 38
        Q94 24 78 24
        L56 24
        Z"
        fill="url(#mpPbowl)"/>

      {/* ── P BOWL LIME HIGHLIGHT — top half of bowl is lighter ── */}
      <path d="
        M68 8
        L80 8
        Q112 8 112 38
        Q112 52 98 60
        L68 50
        L68 24
        L78 24
        Q94 24 94 38
        Q94 44 88 48
        L68 40
        Z"
        fill="url(#mpLime)" opacity="0.65"/>

      {/* ── WHITE CIRCLE COUNTER inside P ── */}
      <circle cx="88" cy="38" r="11" fill="white"/>

      {/* ── LOWER SHADOW TAIL — the dark wedge below M valley ── */}
      <path d="M39 55 L56 55 L56 88 L39 88 Z" fill="url(#mpLight)" opacity="0.7"/>

      {/* ── DARK OVERLAP NOTCH — the shadow where M and P stems cross ── */}
      <path d="M56 55 L73 28 L73 55 Z" fill="url(#mpDark)" opacity="0.35"/>
    </svg>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────────
function App() {
  var [page, setPage] = useState("home");
  var [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  var [profiles, setProfiles] = useState(SEED);
  var [cart, setCart] = useState([]);
  var [viewProfile, setViewProfile] = useState(null);
  var [cartOpen, setCartOpen] = useState(false);
  var [checkoutOpen, setCheckoutOpen] = useState(false);
  var [purchaseSuccess, setPurchaseSuccess] = useState(false);
  var [purchasedProfiles, setPurchasedProfiles] = useState([]);
  var [checkoutEmail, setCheckoutEmail] = useState("");
  var [payfastOpen, setPayfastOpen] = useState(false);
  var [employerAccounts, setEmployerAccounts] = useState([]);
  var [currentEmployer, setCurrentEmployer] = useState(null);

  function updateProfile(id, updates) {
    setProfiles(function(list) {
      return list.map(function(p) { return p.id===id ? Object.assign({},p,updates) : p; });
    });
  }
  function deleteProfile(id) {
    setProfiles(function(list) { return list.filter(function(p){return p.id!==id;}); });
  }

  function addToCart(p) {
    if (!currentEmployer) { setPage("employer"); return; }
    if (p.status === "expired") return;
    setCart(function(c) { return c.find(function(x){return x.id===p.id;}) ? c : c.concat([p]); });
  }
  function removeFromCart(id) { setCart(function(c){return c.filter(function(x){return x.id!==id;});}); }
  var cartTotal = cart.reduce(function(s,p){return s+p.price;}, 0);

  function handleCheckout() {
    var email = checkoutEmail || (currentEmployer && currentEmployer.email) || "";
    if (!validEmail(email)) return;

    // Store cart in sessionStorage so we can retrieve it after PayFast returns
    var orderData = {
      profiles: cart,
      employerEmail: email,
      employerName: currentEmployer ? currentEmployer.contactPerson : "",
      companyName: currentEmployer ? currentEmployer.companyName : "",
      total: cartTotal,
      orderId: "MP-" + Date.now(),
    };
    try { sessionStorage.setItem("mp_pending_order", JSON.stringify(orderData)); } catch(e) {}

    // Close checkout modal and show PayFast redirect screen
    setCheckoutOpen(false);
    setPayfastOpen(true);
  }

  function handlePayfastReturn(success) {
    setPayfastOpen(false);
    if (!success) return;
    // Retrieve stored order
    var raw = "";
    try { raw = sessionStorage.getItem("mp_pending_order") || ""; } catch(e) {}
    var order = raw ? JSON.parse(raw) : {profiles: cart, employerEmail: checkoutEmail};
    try { sessionStorage.removeItem("mp_pending_order"); } catch(e) {}
    setPurchasedProfiles(order.profiles || cart);
    setCart([]);
    setPurchaseSuccess(true);
  }

  var navItems = [
    ["Browse","browse"],
    ["Register","employee"],
    ["Employers","employer"],
  ];

  return (
    <div style={{minHeight:"100vh", background:C.sand, fontFamily:"'Outfit','Segoe UI',sans-serif"}}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap');
        *{box-sizing:border-box;margin:0;padding:0;}
        html{scroll-behavior:smooth;}
        body{background:#F5F0E8;}
        input:focus,select:focus,textarea:focus{border-color:#3ECFB2!important;box-shadow:0 0 0 3px rgba(62,207,178,0.12);outline:none;}
        button{font-family:inherit;}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#c0c8d8;border-radius:3px}

          <Modal onClose={function(){setPayfastOpen(false);}}>
            {/* Step indicator */}
            <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:20}}>
              <div style={{width:32, height:32, borderRadius:"50%", background:C.gray100,
                display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, fontWeight:700, color:C.gray400}}>1</div>
              <div style={{flex:1, height:2, background:C.mint}} />
              <div style={{width:32, height:32, borderRadius:"50%", background:C.mint,
                display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, fontWeight:800, color:C.navy}}>2</div>
              <div style={{flex:1, height:2, background:C.gray100}} />
              <div style={{width:32, height:32, borderRadius:"50%", background:C.gray100,
                display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, fontWeight:700, color:C.gray400}}>3</div>
            </div>
            <div style={{display:"flex", justifyContent:"space-between", marginBottom:24, fontSize:11,
              color:C.gray400, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.05em"}}>
              <span>Order Summary</span><span style={{color:C.mint}}>Payment</span><span>Get Files</span>
            </div>

            {/* PayFast branding */}
            <div style={{background:"linear-gradient(135deg,#00338D,#0052CC)", borderRadius:16,
              padding:"28px 24px", marginBottom:20, textAlign:"center"}}>
              <div style={{color:"rgba(255,255,255,0.7)", fontSize:11, fontWeight:700,
                letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:6}}>Secure Payment via</div>
              <div style={{color:C.white, fontSize:28, fontWeight:800,
                fontFamily:"'Cormorant Garamond',serif", letterSpacing:"-0.02em"}}>PayFast</div>
              <div style={{color:"rgba(255,255,255,0.6)", fontSize:12, marginTop:6}}>
                South Africa's trusted payment gateway
              </div>
              <div style={{background:"rgba(255,255,255,0.12)", borderRadius:10,
                padding:"16px", marginTop:20, textAlign:"left"}}>
                {[
                  {l:"Order reference", v:orderId},
                  {l:"Merchant", v:"myplacements ("+PAYFAST.merchantId+")"},
                  {l:"Profiles", v:cart.length+" profile"+(cart.length!==1?"s":"")},
                  {l:"Email", v:email},
                ].map(function(r){
                  return <div key={r.l} style={{display:"flex", justifyContent:"space-between",
                    color:C.white, fontSize:12, marginBottom:8}}>
                    <span style={{opacity:0.7}}>{r.l}</span>
                    <span style={{fontWeight:700, fontSize:11}}>{r.v}</span>
                  </div>;
                })}
                <div style={{display:"flex", justifyContent:"space-between",
                  color:C.white, fontSize:16, fontWeight:800, marginTop:12,
                  paddingTop:12, borderTop:"1px solid rgba(255,255,255,0.15)"}}>
                  <span>Amount due</span><span>R{cartTotal.toFixed(2)}</span>
                </div>
              </div>
            </div>

            {/* Payment methods */}
            <div style={{display:"flex", gap:8, justifyContent:"center", marginBottom:16, flexWrap:"wrap"}}>
              {["Visa","Mastercard","EFT","SnapScan","Mobicred"].map(function(m){
                return <span key={m} style={{background:C.gray50, border:"1px solid "+C.gray100,
                  borderRadius:6, padding:"5px 12px", fontSize:11, fontWeight:700, color:C.gray500}}>{m}</span>;
              })}
            </div>

            {PAYFAST.sandbox && (
              <div style={{background:C.amberLight, borderRadius:10, padding:"12px 14px",
                fontSize:12, color:C.amber, fontWeight:600, marginBottom:16}}>
                🧪 Sandbox mode — use test card 4000000000000002. No real money charged.
              </div>
            )}

            <Btn variant="navy" full onClick={submitToPayFast}>
              Pay R{cartTotal.toFixed(2)} via PayFast →
            </Btn>
            <p style={{fontSize:11, color:C.gray300, textAlign:"center", marginTop:12}}>
              🔒 256-bit SSL · PCI DSS compliant · Powered by PayFast
            </p>
          </Modal>
        );
      })()}

      {/* Purchase success — Step 3: Files released */}
      {purchaseSuccess && (
        <Modal onClose={function(){setPurchaseSuccess(false);}} wide={true}>
          <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:20}}>
            <div style={{width:32, height:32, borderRadius:"50%", background:C.gray100,
              display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, fontWeight:700, color:C.gray400}}>1</div>
            <div style={{flex:1, height:2, background:C.mint}} />
            <div style={{width:32, height:32, borderRadius:"50%", background:C.gray100,
              display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, fontWeight:700, color:C.gray400}}>2</div>
            <div style={{flex:1, height:2, background:C.mint}} />
            <div style={{width:32, height:32, borderRadius:"50%", background:C.mint,
              display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, fontWeight:800, color:C.navy}}>✓</div>
          </div>
          <div style={{display:"flex", justifyContent:"space-between", marginBottom:24, fontSize:11,
            color:C.gray400, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.05em"}}>
            <span>Order Summary</span><span>Payment</span><span style={{color:C.mint}}>Files Released</span>
          </div>

          <div style={{textAlign:"center", marginBottom:28}}>
            <div style={{fontSize:56, marginBottom:12}}>🎉</div>
            <h2 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:30, color:C.navy, marginBottom:8}}>
              Payment Confirmed!
            </h2>
            <p style={{color:C.gray500, fontSize:14, lineHeight:1.7}}>
              PayFast has confirmed your payment. The contact details, CV and police clearance for each profile have been sent to{" "}
              <strong style={{color:C.navy}}>{checkoutEmail||(currentEmployer&&currentEmployer.email)}</strong>.
            </p>
          </div>

          {/* Released files per profile */}
          <div style={{display:"flex", flexDirection:"column", gap:16, marginBottom:24}}>
            {purchasedProfiles.map(function(p){
              var colors = p.photoColor||["#e0e7ff","#3730a3"];
              return (
                <div key={p.id} style={{border:"1.5px solid "+C.green, borderRadius:14, overflow:"hidden"}}>
                  {/* Profile header */}
                  <div style={{background:C.greenLight, padding:"14px 18px",
                    display:"flex", alignItems:"center", gap:12}}>
                    <div style={{width:44, height:44, borderRadius:"50%", flexShrink:0,
                      background:"linear-gradient(135deg,"+colors[0]+","+colors[1]+")",
                      display:"flex", alignItems:"center", justifyContent:"center",
                      color:C.white, fontSize:18, fontWeight:700, fontFamily:"'Cormorant Garamond',serif"}}>
                      {p.firstName[0]}
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontWeight:700, color:C.navy, fontSize:15}}>{p.firstName} — {p.role}</div>
                      <div style={{fontSize:12, color:C.green, fontWeight:600, marginTop:2}}>
                        ✓ Files unlocked · R{p.price} paid
                      </div>
                    </div>
                  </div>
                  {/* Unlocked content */}
                  <div style={{padding:"16px 18px", display:"flex", flexDirection:"column", gap:10}}>
                    {/* Contact details */}
                    <div style={{background:C.white, border:"1px solid "+C.gray100,
                      borderRadius:10, padding:"12px 16px"}}>
                      <div style={{fontSize:11, fontWeight:800, color:C.navy,
                        textTransform:"uppercase", letterSpacing:"0.07em", marginBottom:10}}>
                        📇 Contact Details
                      </div>
                      <div style={{display:"flex", flexDirection:"column", gap:6}}>
                        <div style={{display:"flex", alignItems:"center", gap:10, fontSize:13, color:C.gray700}}>
                          <span style={{fontSize:16}}>📧</span>
                          <span style={{fontWeight:600}}>{p.email}</span>
                        </div>
                        {p.phone && (
                          <div style={{display:"flex", alignItems:"center", gap:10, fontSize:13, color:C.gray700}}>
                            <span style={{fontSize:16}}>📞</span>
                            <span style={{fontWeight:600}}>{p.phone}</span>
                          </div>
                        )}
                      </div>
                    </div>
                    {/* Documents */}
                    <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
                      {p.hasCv && (
                        <div style={{background:C.white, border:"1px solid "+C.gray100,
                          borderRadius:10, padding:"12px 14px", display:"flex",
                          alignItems:"center", gap:10, cursor:"pointer"}}
                          onClick={function(){alert("In the live site this downloads "+p.firstName+"'s CV PDF from secure storage.");}}>
                          <span style={{fontSize:24}}>📄</span>
                          <div>
                            <div style={{fontSize:12, fontWeight:700, color:C.navy}}>CV / Profile Doc</div>
                            <div style={{fontSize:11, color:C.blue, fontWeight:600, marginTop:2}}>
                              Click to download
                            </div>
                          </div>
                        </div>
                      )}
                      {p.hasCriminalRecord && (
                        <div style={{background:C.white, border:"1px solid "+C.gray100,
                          borderRadius:10, padding:"12px 14px", display:"flex",
                          alignItems:"center", gap:10, cursor:"pointer"}}
                          onClick={function(){alert("In the live site this downloads "+p.firstName+"'s police clearance certificate from secure storage.");}}>
                          <span style={{fontSize:24}}>🔒</span>
                          <div>
                            <div style={{fontSize:12, fontWeight:700, color:C.navy}}>Police Clearance</div>
                            <div style={{fontSize:11, color:C.blue, fontWeight:600, marginTop:2}}>
                              Click to download
                            </div>
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Email confirmation notice */}
          <div style={{background:C.gray50, borderRadius:12, padding:"16px 18px",
            display:"flex", gap:14, alignItems:"flex-start", marginBottom:20}}>
            <span style={{fontSize:24, flexShrink:0}}>📬</span>
            <div>
              <div style={{fontSize:13, fontWeight:700, color:C.navy, marginBottom:4}}>
                Email sent to {checkoutEmail||(currentEmployer&&currentEmployer.email)}
              </div>
              <div style={{fontSize:12, color:C.gray500, lineHeight:1.7}}>
                All contact details and documents for your purchased profiles have been sent to your email address. Check your inbox — also check spam if you do not see it within a few minutes.
              </div>
            </div>
          </div>

          <Btn variant="primary" full onClick={function(){setPurchaseSuccess(false);setPage("browse");}}>
            Continue Browsing
          </Btn>
        </Modal>
      )}

      {/* Profile detail */}
      {viewProfile && (function(){
        var p = viewProfile;
        var colors = p.photoColor||["#e0e7ff","#3730a3"];
        var days = p.expiryDate ? daysUntil(p.expiryDate) : 0;
        return (
          <Modal onClose={function(){setViewProfile(null);}} wide={true}>
            <div style={{display:"flex", alignItems:"center", gap:18, marginBottom:16}}>
              <div style={{width:80, height:80, borderRadius:"50%", flexShrink:0,
                background:p.photoDataUrl?"url("+p.photoDataUrl+") center/cover"
                  :"linear-gradient(135deg,"+colors[0]+","+colors[1]+")",
                display:"flex", alignItems:"center", justifyContent:"center",
                border:"3px solid "+C.gray100, color:C.white, fontSize:32, fontWeight:700,
                fontFamily:"'Cormorant Garamond',serif"}}>
                {!p.photoDataUrl&&p.firstName[0]}
              </div>
              <div>
                <h2 style={{fontFamily:"'Cormorant Garamond',serif", fontSize:28, color:C.navy, margin:0}}>{p.firstName}</h2>
                <div style={{color:C.blue, fontWeight:600, fontSize:15}}>{p.role}</div>
                <div style={{marginTop:6}}><StatusPill status={p.status} days={days} /></div>
              </div>
            </div>
            <div style={{background:C.gray50, borderRadius:10, padding:"12px 16px", marginBottom:20,
              display:"flex", gap:20, flexWrap:"wrap", fontSize:13, color:C.gray700}}>
              <span>📅 Listed: {formatDate(p.uploadDate)}</span>
              <span>⏳ Expires: {formatDate(p.expiryDate)}</span>
              {p.nextBillingDate&&<span>💳 Next renewal: {formatDate(p.nextBillingDate)}</span>}
            </div>
            <div style={{display:"flex", gap:8, flexWrap:"wrap", marginBottom:20}}>
              <Badge label={p.category} i={0} />
              <Badge label={p.yearsExp+" years exp"} i={1} />
              <Badge label={p.availability} i={2} />
              {p.hasCriminalRecord&&<Badge label="Verified clear record" i={4} />}
            </div>
            <div style={{marginBottom:18}}>
              <h3 style={{fontSize:11, fontWeight:800, color:C.navy, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8}}>About</h3>
              <p style={{fontSize:14, color:C.gray500, lineHeight:1.8, margin:0}}>{p.about}</p>
            </div>
            <div style={{marginBottom:18}}>
              <h3 style={{fontSize:11, fontWeight:800, color:C.navy, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:10}}>Skills & Duties</h3>
              <div style={{display:"flex", gap:8, flexWrap:"wrap"}}>{p.skills.map(function(s,i){return <Badge key={s} label={s} i={i} />;})}</div>
            </div>
            {p.education&&<div style={{marginBottom:18}}>
              <h3 style={{fontSize:11, fontWeight:800, color:C.navy, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:8}}>Qualifications</h3>
              <p style={{fontSize:14, color:C.gray500, margin:0}}>{p.education}</p>
            </div>}
            <div style={{marginBottom:24}}>
              <h3 style={{fontSize:11, fontWeight:800, color:C.navy, textTransform:"uppercase", letterSpacing:"0.1em", marginBottom:10}}>Documents</h3>
              <div style={{display:"flex", gap:12, flexWrap:"wrap"}}>
                {p.hasCv&&<div style={{background:C.greenLight, borderRadius:9, padding:"10px 16px", fontSize:13, color:C.green, fontWeight:700}}>📄 Profile doc attached</div>}
                {p.hasCriminalRecord&&<div style={{background:C.greenLight, borderRadius:9, padding:"10px 16px", fontSize:13, color:C.green, fontWeight:700}}>🔒 Police clearance verified</div>}
              </div>
            </div>
            <div style={{background:C.amberLight, borderRadius:10, padding:"13px 16px",
              fontSize:13, color:C.amber, marginBottom:24, fontWeight:600}}>
              🔒 Full contact details unlocked after purchase.
            </div>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
              <div>
                <div style={{fontSize:11, color:C.gray500}}>Unlock contact details</div>
                <div style={{fontFamily:"'Cormorant Garamond',serif", fontSize:26, fontWeight:700, color:C.navy}}>R{p.price}</div>
              </div>
              {p.status!=="expired" && (
                cart.some(function(c){return c.id===p.id;})
                  ? <Btn variant="danger" onClick={function(){removeFromCart(p.id);setViewProfile(null);}}>Remove from Cart</Btn>
                  : <Btn variant="primary" onClick={function(){addToCart(p);setViewProfile(null);}}>Add to Cart</Btn>
              )}
              {p.status==="expired" && <span style={{fontSize:13, color:C.gray300, fontWeight:600}}>This profile has expired</span>}
            </div>
          </Modal>
        );
      })()}

      <footer style={{background:"linear-gradient(180deg,#0a1a2e,#0F2137)",
        borderTop:"1px solid rgba(255,255,255,0.06)", padding:"48px 48px 32px"}}>
        <div style={{maxWidth:1000, margin:"0 auto"}}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start",
            flexWrap:"wrap", gap:32, marginBottom:40}}>
            <div>
              <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:8}}>
                <MPLogo size={38} />
                <div style={{fontFamily:"'Cormorant Garamond',serif", fontSize:24, fontWeight:700}}>
                  <span style={{color:C.white}}>my</span>
                  <span style={{background:"linear-gradient(90deg,#3ECFB2,#C9A84C)",
                    WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent",
                    backgroundClip:"text"}}>placements</span>
                </div>
              </div>
              <p style={{fontSize:12, color:"rgba(255,255,255,0.35)", lineHeight:1.7, maxWidth:260}}>
                South Africa's trusted domestic placement marketplace. Connecting families with verified staff since 2013.
              </p>
            </div>
            <div style={{display:"flex", gap:48, flexWrap:"wrap"}}>
              {[
                {h:"For Employers", links:["Browse Profiles","Create Account","How It Works"]},
                {h:"For Workers", links:["Register Profile","Pricing — R20/mo","Document Requirements"]},
                {h:"Company", links:["About myplacements","Est. 2013","Built by jackapp"]},
              ].map(function(col){
                return <div key={col.h}>
                  <div style={{fontSize:10, fontWeight:800, letterSpacing:"0.15em",
                    textTransform:"uppercase", color:"rgba(255,255,255,0.3)", marginBottom:14}}>{col.h}</div>
                  {col.links.map(function(l){
                    return <div key={l} style={{fontSize:12, color:"rgba(255,255,255,0.45)",
                      marginBottom:10, lineHeight:1.5}}>{l}</div>;
                  })}
                </div>;
              })}
            </div>
          </div>
          <div style={{borderTop:"1px solid rgba(255,255,255,0.06)", paddingTop:24,
            display:"flex", justifyContent:"space-between", alignItems:"center",
            flexWrap:"wrap", gap:12}}>
            <div style={{fontSize:11, color:"rgba(255,255,255,0.25)"}}>
              © 2013–2026 myplacements · All rights reserved
            </div>
            <div style={{fontSize:11, color:"rgba(255,255,255,0.2)"}}>
              Built by <span style={{color:"rgba(62,207,178,0.5)", fontWeight:700}}>jackapp</span> · Powered by PayFast
            </div>
          </div>
        </div>
      </footer>
    </div>
  );
}


window.addEventListener('load', function() {
  try {
    var loader = document.getElementById('mp-loading');
    var container = document.getElementById('root');
    var root = ReactDOM.createRoot(container);
    root.render(React.createElement(App));
    if (loader) loader.style.display = 'none';
  } catch(e) {
    console.error('Mount error:', e);
    var loader = document.getElementById('mp-loading');
    if (loader) loader.innerHTML = '<h1 style="color:#3ECFB2;font-family:Georgia,serif;">myplacements</h1><p style="color:#E63946;margin-top:16px;padding:0 20px;text-align:center;">Error: ' + e.message + '</p><button onclick="location.reload()" style="margin-top:20px;background:#3ECFB2;color:#0F2137;border:none;padding:12px 24px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;">Refresh</button>';
  }
});
</script>
</body>
</html>
